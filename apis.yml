name: Lonza
description: 'Lonza Group is a Swiss multinational contract development and manufacturing organization
  (CDMO) serving the pharmaceutical, biotech, and nutrition industries. Headquartered in Basel, Switzerland,
  Lonza develops and manufactures active pharmaceutical ingredients (APIs), biologics, cell and gene
  therapies, and drug products for customers worldwide. Note: within Lonza''s domain, "API" refers to
  Active Pharmaceutical Ingredient (a chemical/biologic substance), not a software/web API. Lonza
  publishes no public developer portal, REST/GraphQL API, OpenAPI specification, or machine-readable
  API surface. This profile was surfaced as a portfolio-adjacent lead and enriched; the honest result
  of the enrichment pass is that Lonza has no software API surface to catalog. The only machine-derived
  artifact is a domain-security probe of lonza.com.'
